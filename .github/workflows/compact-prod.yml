name: Compact source distribution

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compact-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compact-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Create compact source distribution
        run: python tools/minify_sources.py --output build/latch-production --verify
      - name: Build and test compact distribution
        run: |
          cmake -S build/latch-production -B build/compact-check -G Ninja -DCMAKE_BUILD_TYPE=Release -DLS_BUILD_TESTS=ON
          cmake --build build/compact-check --parallel
          ctest --test-dir build/compact-check --output-on-failure --timeout 120
      - uses: actions/upload-artifact@v7
        with:
          name: latch-compact-source
          path: build/latch-production
          if-no-files-found: error
          retention-days: 14
