name: Compact production sources

on:
  pull_request:
    branches: [prod]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: write

concurrency:
  group: compact-prod-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  production-source-agent:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compact production source files
        run: python tools/minify_sources.py --in-place --verify
      - name: Commit production formatting
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "latch-prod-minifier[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style(prod): compact production sources"
          git push origin "HEAD:$HEAD_REF"
