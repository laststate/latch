name: Hardware in the loop
on:
  workflow_dispatch:
    inputs:
      board_config:
        description: Board JSON path present on the self-hosted runner
        required: true
        default: C:\latch-hil\stm32u5.json
      scenario:
        type: choice
        options: [brownout, watchdog, mpu, trustzone, fpu-lazy, flash, reset-registers]
        required: true
permissions:
  contents: read
concurrency:
  group: latch-hil-${{ inputs.board_config }}
  cancel-in-progress: false
jobs:
  destructive-hil:
    runs-on: [self-hosted, latch-hil]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install hash-pinned serial dependency
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes --requirement hil/requirements.txt
      - name: Run physical fault scenario
        run: python hil/runner.py --board "${{ inputs.board_config }}" --scenario "${{ inputs.scenario }}"
