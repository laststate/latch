name: Hardware in the loop
on:
  workflow_dispatch:
    inputs:
      board_config:
        description: Board JSON path present on the self-hosted runner
        required: true
        default: C:\latch-hil\stm32u5.json
      scenario:
        type: choice
        options: [brownout, hardfault, watchdog, stack-canary, mpu, trustzone, fpu-lazy, flash, reset-registers]
        required: true
permissions:
  contents: read
concurrency:
  group: latch-hil-${{ inputs.board_config }}
  cancel-in-progress: false
jobs:
  destructive-hil:
    runs-on: [self-hosted, latch-hil]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install hash-pinned serial dependency
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes --requirement hil/requirements.txt
      - name: Run physical fault scenario
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path hil-evidence | Out-Null
          python hil/runner.py --board "${{ inputs.board_config }}" --scenario "${{ inputs.scenario }}" `
            --commit "${{ github.sha }}" --evidence-out "hil-evidence/${{ inputs.scenario }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: hil-${{ inputs.scenario }}-${{ github.sha }}
          path: hil-evidence
          if-no-files-found: warn
