name: Maintenance PR bot
on:
  schedule:
    - cron: '23 6 1 * *'
  workflow_dispatch:
permissions:
  actions: write
  contents: write
  pull-requests: write
concurrency:
  group: maintenance-pr
  cancel-in-progress: false
jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply deterministic formatters
        run: |
          find src include tests fuzz benchmarks tools ports arch \
            -type f \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) \
            -print0 | xargs -0 clang-format -i
          cargo fmt --manifest-path rust/latch/Cargo.toml
      - name: Verify formatted tree
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLS_BUILD_TESTS=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          cargo test --manifest-path rust/latch/Cargo.toml
      - name: Open or refresh maintenance PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/maintenance
        run: |
          if git diff --quiet; then
            echo "Repository already normalized"
            exit 0
          fi
          git config user.name "latch-maintenance[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add --all
          git commit -m "chore: apply repository maintenance fixes"
          git push --force origin "$BRANCH"
          if ! gh pr list --head "$BRANCH" --state open --json number --jq 'length > 0' | grep -q true; then
            gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
              --title "chore: automated repository maintenance" \
              --body "Automated formatting and safe maintenance fixes. Tests passed before this PR was opened."
          fi
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run quality.yml --ref "$BRANCH"
          gh workflow run rust.yml --ref "$BRANCH"
          gh workflow run workflow-lint.yml --ref "$BRANCH"
