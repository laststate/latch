name: Maintenance health bot
on:
  schedule:
    - cron: '23 6 1 * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: maintenance-health
  cancel-in-progress: false
jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - name: Apply deterministic formatters
        run: |
          find src include tests fuzz benchmarks tools ports arch \
            -type f \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) \
            -print0 | xargs -0 clang-format -i
          cargo fmt --manifest-path rust/latch/Cargo.toml
      - name: Verify formatted tree
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLS_BUILD_TESTS=ON
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          cargo test --manifest-path rust/latch/Cargo.toml
      - name: Report maintenance drift
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          title="Repository maintenance drift"
          number="$(gh issue list --repo "$REPO" --state open --limit 100 \
            --json number,title --jq 'map(select(.title == "Repository maintenance drift"))[0].number // empty')"
          if git diff --quiet; then
            if [ -n "$number" ]; then
              gh issue close "$number" --repo "$REPO" \
                --comment "The scheduled maintenance check is clean again."
            fi
            exit 0
          fi
          {
            echo "The monthly formatter pass changed tracked files, and the formatted tree passed its local tests."
            echo
            echo "Run the checked-in formatters locally and open a normal pull request."
            echo
            echo '```text'
            git diff --name-only
            echo '```'
          } > "$RUNNER_TEMP/maintenance-drift.md"
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$REPO" \
              --body-file "$RUNNER_TEMP/maintenance-drift.md" \
              --add-label maintenance
          else
            gh issue create --repo "$REPO" \
              --title "$title" \
              --body-file "$RUNNER_TEMP/maintenance-drift.md" \
              --label maintenance
          fi
