name: Cross toolchains
on:
  push:
    branches: [prod]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cortex-m:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install gcc-arm-none-eabi ninja-build
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60)
          for attempt in 1 2 3; do
            if timeout 90 sudo apt-get update "${opts[@]}" && timeout 240 sudo apt-get install -y "${opts[@]}" gcc-arm-none-eabi ninja-build; then
              exit 0
            fi
            echo "apt attempt ${attempt}/3 failed, retrying in 15s..." >&2
            sleep 15
          done
          echo "apt install failed after 3 attempts" >&2
          exit 1
      - run: cmake --preset arm-cortex-m4
      - run: cmake --build --preset arm-cortex-m4 --parallel
      - run: python tools/check_size.py build/arm-cortex-m4/liblatch.a
      - name: Measure default and constrained Cortex-M4 source profiles
        run: |
          mkdir -p build/footprints
          python tools/measure_footprint.py build/arm-cortex-m4/liblatch.a \
            --tool arm-none-eabi-size --label cortex-m4-default-static-archive \
            --format json --output build/footprints/cortex-m4-default.json
          cmake -S . -B build/arm-cortex-m4-small -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/arm-none-eabi.cmake \
            -DLS_BUILD_TESTS=OFF -DLS_CONSTRAINED_PROFILE=1 -DLS_STORE_STRINGS=0 \
            -DLS_ENABLE_BREADCRUMBS=0 -DLS_ENABLE_METRICS=0 -DLS_ENABLE_LOGS=0 \
            -DLS_ENABLE_POWER_SAMPLES=0 -DLS_ENABLE_PERFORMANCE=0 \
            -DLS_ENABLE_DUMPS=0 -DLS_ENABLE_ASSERTS=0 -DLS_ENABLE_STACK_SNAPSHOT=0 \
            -DLS_MAX_EVENT_SIZE=768 -DLS_BREADCRUMB_CAPACITY=1 -DLS_METRIC_CAPACITY=1 \
            -DLS_POWER_SAMPLE_CAPACITY=1 -DLS_HEALTH_CAPACITY=1 -DLS_SPAN_CAPACITY=1 \
            -DLS_MAX_TRANSPORTS=1 -DLS_MAX_DUMP_REGIONS=1 -DLS_MAX_REDACTIONS=1 \
            -DLS_SPOOL_MAX_RECORDS=1 -DLS_POLICY_CAPACITY=1 -DLS_DEDUP_CAPACITY=1
          cmake --build build/arm-cortex-m4-small --target latch --parallel
          python tools/measure_footprint.py build/arm-cortex-m4-small/liblatch.a \
            --tool arm-none-eabi-size --label cortex-m4-small-static-archive \
            --format json --output build/footprints/cortex-m4-small.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cortex-m4-footprints
          path: build/footprints/*.json
          if-no-files-found: error
  riscv32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install gcc-riscv64-unknown-elf ninja-build
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60)
          for attempt in 1 2 3; do
            if timeout 90 sudo apt-get update "${opts[@]}" && timeout 240 sudo apt-get install -y "${opts[@]}" gcc-riscv64-unknown-elf ninja-build; then
              exit 0
            fi
            echo "apt attempt ${attempt}/3 failed, retrying in 15s..." >&2
            sleep 15
          done
          echo "apt install failed after 3 attempts" >&2
          exit 1
      - run: cmake --preset riscv32
      - run: cmake --build --preset riscv32 --parallel
  riscv64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install gcc-riscv64-unknown-elf ninja-build
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60)
          for attempt in 1 2 3; do
            if timeout 90 sudo apt-get update "${opts[@]}" && timeout 240 sudo apt-get install -y "${opts[@]}" gcc-riscv64-unknown-elf ninja-build; then
              exit 0
            fi
            echo "apt attempt ${attempt}/3 failed, retrying in 15s..." >&2
            sleep 15
          done
          echo "apt install failed after 3 attempts" >&2
          exit 1
      - run: cmake --preset riscv64
      - run: cmake --build --preset riscv64 --parallel
  compile-profiles:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        strings: [0, 1]
        breadcrumbs: [0, 1]
        metrics: [0, 1]
        dumps: [0, 1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLS_BUILD_TESTS=OFF -DLS_STORE_STRINGS=${{ matrix.strings }} -DLS_ENABLE_BREADCRUMBS=${{ matrix.breadcrumbs }} -DLS_ENABLE_METRICS=${{ matrix.metrics }} -DLS_ENABLE_DUMPS=${{ matrix.dumps }}
      - run: cmake --build build --parallel
