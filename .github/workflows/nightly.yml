name: Nightly stress
on:
  schedule:
    - cron: '29 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install valgrind ninja-build
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60)
          for attempt in 1 2 3; do
            if timeout 90 sudo apt-get update "${opts[@]}" && timeout 240 sudo apt-get install -y "${opts[@]}" valgrind ninja-build; then
              exit 0
            fi
            echo "apt attempt ${attempt}/3 failed, retrying in 15s..." >&2
            sleep 15
          done
          echo "apt install failed after 3 attempts" >&2
          exit 1
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLS_BUILD_TESTS=ON -DLS_BUILD_TOOLS=ON -DLS_BUILD_BENCHMARKS=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure --repeat until-pass:3 --timeout 120
      - run: valgrind --error-exitcode=1 --leak-check=full build/latch-tests
      - run: valgrind --error-exitcode=1 --leak-check=full build/latch-envelope-fuzz-tests
      - run: valgrind --error-exitcode=1 --leak-check=full build/latch-spool-stress-tests
      - run: build/latch-benchmark > benchmark.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-results
          path: benchmark.json
