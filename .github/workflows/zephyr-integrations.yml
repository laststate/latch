name: Zephyr native integrations
on:
  pull_request:
    paths: ["ports/zephyr/**", "zephyr/**", "tests/zephyr/**", "examples/zephyr-first-capture/**", "include/laststate/**", ".github/workflows/zephyr-integrations.yml"]
  push:
    branches: [prod]
    paths: ["ports/zephyr/**", "zephyr/**", "tests/zephyr/**", "examples/zephyr-first-capture/**", "include/laststate/**", ".github/workflows/zephyr-integrations.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-stack-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: nrf52840dk/nrf52840
            config: ble.conf
            name: ble-gatt
          - board: nucleo_h753zi
            config: can.conf
            name: can-fd
          - board: b_l072z_lrwan1
            config: lorawan.conf
            name: lorawan
          - board: native_sim/native/64
            config: tls.conf
            name: tls-cellular-socket
    name: ${{ matrix.name }} (${{ matrix.board }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a # v1
        with:
          app-path: zephyr
          base-path: tests
          toolchains: arm-zephyr-eabi
      - working-directory: tests
        run: west build -b "${{ matrix.board }}" zephyr -- -DCONF_FILE="${{ matrix.config }}"
  first-capture-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a # v1
        with:
          app-path: zephyr-first-capture
          base-path: examples
          toolchains: arm-zephyr-eabi
      - working-directory: examples
        run: west build -b native_sim/native/64 zephyr-first-capture -- -DZEPHYR_EXTRA_MODULES=${{ github.workspace }}
      - working-directory: examples
        run: west build -t run
