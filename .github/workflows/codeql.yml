name: CodeQL
on:
  push:
    branches: [prod]
  pull_request:
  schedule:
    - cron: '41 4 * * 2'
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build_mode: manual
          - language: actions
            build_mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
      - if: matrix.language == 'c-cpp'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLS_BUILD_TESTS=ON && cmake --build build --parallel
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
