name: Workflow lint
on:
  pull_request:
    paths: ['.github/**']
  push:
    branches: [prod]
    paths: ['.github/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: actionlint -color
