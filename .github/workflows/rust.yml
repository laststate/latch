name: Rust no_std
on:
  push:
    branches: [prod]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf,riscv32imac-unknown-none-elf
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/latch/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/latch/Cargo.lock', 'rust/latch/Cargo.toml') }}
      - run: cargo fmt --manifest-path rust/latch/Cargo.toml -- --check
      - run: cargo clippy --manifest-path rust/latch/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/latch/Cargo.toml
      - run: cargo check --manifest-path rust/latch/Cargo.toml --target thumbv7em-none-eabihf
      - run: cargo check --manifest-path rust/latch/Cargo.toml --target riscv32imac-unknown-none-elf
