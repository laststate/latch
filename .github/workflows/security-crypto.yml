name: Cryptography assurance
on:
  push:
    branches: [prod]
    paths: ["src/security/**", "src/storage/secure_storage.c", "src/envelope/lep.c", "include/laststate/security.h", "include/laststate/secure_storage.h", "tests/test_crypto*", "tests/test_secure*", ".github/workflows/security-crypto.yml"]
  pull_request:
    paths: ["src/security/**", "src/storage/secure_storage.c", "src/envelope/lep.c", "include/laststate/security.h", "include/laststate/secure_storage.h", "tests/test_crypto*", "tests/test_secure*", ".github/workflows/security-crypto.yml"]
  schedule:
    - cron: "31 2 * * 2"
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  sanitizers:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:check_initialization_order=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLS_BUILD_TESTS=ON -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
  libsodium-interoperability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install libsodium-dev ninja-build
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60)
          for attempt in 1 2 3; do
            if timeout 90 sudo apt-get update "${opts[@]}" && timeout 240 sudo apt-get install -y "${opts[@]}" libsodium-dev ninja-build; then
              exit 0
            fi
            echo "apt attempt ${attempt}/3 failed, retrying in 15s..." >&2
            sleep 15
          done
          echo "apt install failed after 3 attempts" >&2
          exit 1
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLS_BUILD_TESTS=ON -DLS_TEST_LIBSODIUM=ON -DLS_BUILD_LIBSODIUM_PROVIDER=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build -R "crypto|security|secure|sodium" --output-on-failure
      - run: cmake -S . -B build-commercial -G Ninja -DCMAKE_BUILD_TYPE=Release -DLS_BUILD_TESTS=OFF -DLS_COMMERCIAL_PROFILE=ON -DLS_BUILD_LIBSODIUM_PROVIDER=ON
      - run: cmake --build build-commercial --parallel
  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install valgrind ninja-build
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60)
          for attempt in 1 2 3; do
            if timeout 90 sudo apt-get update "${opts[@]}" && timeout 240 sudo apt-get install -y "${opts[@]}" valgrind ninja-build; then
              exit 0
            fi
            echo "apt attempt ${attempt}/3 failed, retrying in 15s..." >&2
            sleep 15
          done
          echo "apt install failed after 3 attempts" >&2
          exit 1
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLS_BUILD_TESTS=ON
      - run: cmake --build build --parallel
      - run: valgrind --error-exitcode=99 --leak-check=full --track-origins=yes build/latch-crypto-vectors-tests
      - run: valgrind --error-exitcode=99 --leak-check=full --track-origins=yes build/latch-secure-power-loss-tests
  mbedtls-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install libmbedtls-dev ninja-build
        shell: bash
        run: |
          set -euo pipefail
          opts=(-o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60)
          for attempt in 1 2 3; do
            if timeout 90 sudo apt-get update "${opts[@]}" && timeout 240 sudo apt-get install -y "${opts[@]}" libmbedtls-dev ninja-build; then
              exit 0
            fi
            echo "apt attempt ${attempt}/3 failed, retrying in 15s..." >&2
            sleep 15
          done
          echo "apt install failed after 3 attempts" >&2
          exit 1
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLS_BUILD_TESTS=OFF -DLS_BUILD_MBEDTLS_PORT=ON
      - run: cmake --build build --parallel
