name: Workflow health bot
on:
  workflow_run:
    workflows: [Nightly stress, Fuzz, Cross toolchains, CodeQL, Coverage, Rust no_std]
    types: [completed]
permissions:
  contents: read
  issues: write
jobs:
  report-failure:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Create or update failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          gh label create automation-failure --repo "$REPO" --color d73a4a --force
          title="Automation failure: $WORKFLOW"
          number=$(gh issue list --repo "$REPO" --state open --label automation-failure \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          body="The automated workflow **$WORKFLOW** failed. Run: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body" --label automation-failure
          fi
  close-recovered-failure:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Close an existing incident after recovery
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          title="Automation failure: $WORKFLOW"
          number=$(gh issue list --repo "$REPO" --state open --label automation-failure \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "The workflow recovered successfully: $RUN_URL"
            gh issue close "$number" --repo "$REPO" --reason completed
          fi
