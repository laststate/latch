name: CI
on:
  push:
    branches: [prod]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
            build_type: Debug
            linux_port: ON
          - os: ubuntu-latest
            cc: clang
            cxx: clang++
            build_type: Release
            linux_port: ON
          - os: macos-latest
            cc: clang
            cxx: clang++
            build_type: Debug
            linux_port: OFF
          - os: windows-latest
            cc: cl
            cxx: cl
            build_type: Debug
            linux_port: OFF
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DLS_BUILD_TESTS=ON -DLS_FREESTANDING_CHECK=ON -DLS_BUILD_LINUX=${{ matrix.linux_port }} -DLS_BUILD_XTENSA=ON -DLS_BUILD_TOOLS=ON -DLS_BUILD_BENCHMARKS=ON -DLS_BUILD_EXAMPLES=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --timeout 60
      - name: Test installed CMake package
        run: |
          cmake --install build --config ${{ matrix.build_type }} --prefix build/install
          cmake -S tests/package -B build/consumer -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/install
          cmake --build build/consumer --config ${{ matrix.build_type }}
      - name: Test add_subdirectory consumer
        run: cmake -S examples/add-subdirectory -B build/add-subdirectory-consumer -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build add_subdirectory consumer
        run: cmake --build build/add-subdirectory-consumer --config ${{ matrix.build_type }}
      - name: Run add_subdirectory consumer
        run: ctest --test-dir build/add-subdirectory-consumer -C ${{ matrix.build_type }} --output-on-failure
      - name: Test FetchContent consumer against checkout
        run: cmake -S examples/fetch-content -B build/fetch-content-consumer -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DFETCHCONTENT_SOURCE_DIR_LATCH=${{ github.workspace }}
      - name: Build FetchContent consumer
        run: cmake --build build/fetch-content-consumer --config ${{ matrix.build_type }}
      - name: Run FetchContent consumer
        run: ctest --test-dir build/fetch-content-consumer -C ${{ matrix.build_type }} --output-on-failure
      - name: Package
        run: cpack --config build/CPackConfig.cmake -C ${{ matrix.build_type }}
      - name: Test extracted package archive
        shell: bash
        run: |
          archive=$(find . -maxdepth 1 -name 'laststate-latch-*.zip' -print -quit)
          python tools/test_cpack_archive.py "$archive" --consumer tests/package --config ${{ matrix.build_type }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: latch-${{ matrix.os }}-${{ matrix.cc }}
          path: laststate-latch-*
          if-no-files-found: error
