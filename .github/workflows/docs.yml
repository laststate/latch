name: Documentation
on:
  pull_request:
    paths: ['**/*.md', '.github/workflows/**']
  push:
    branches: [prod]
    paths: ['**/*.md', '.github/workflows/**']
permissions:
  contents: read
jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python tools/check_docs.py
      - run: python tools/check_test_vector.py
