name: Benchmarks
on:
  schedule:
    - cron: '5 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'include/**', 'benchmarks/**']
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLS_BUILD_TESTS=OFF -DLS_BUILD_BENCHMARKS=ON
      - run: cmake --build build --parallel
      - run: build/latch-benchmark | tee benchmark.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-${{ github.sha }}
          path: benchmark.json
