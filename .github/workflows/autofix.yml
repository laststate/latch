name: PR format check
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: format-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify-format:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - name: Verify native formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          while IFS= read -r -d '' file; do
            case "$file" in
              *.c|*.h|*.cpp|*.hpp) clang-format --dry-run --Werror "$file" ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA...$HEAD_SHA")
      - name: Verify Rust formatting
        run: cargo fmt --manifest-path rust/latch/Cargo.toml -- --check
