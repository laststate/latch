name: Required

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: required-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf,riscv32imac-unknown-none-elf
      - name: Build portable runtime, tools, and example
        run: |
          cmake --preset host-debug
          cmake --build --preset host-debug --parallel
      - name: Run portable tests
        run: ctest --preset host-debug --timeout 120
      - name: Validate downstream CMake and packaged consumers
        run: |
          cmake -S examples/add-subdirectory -B build/add-subdirectory-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/add-subdirectory-consumer --parallel
          ctest --test-dir build/add-subdirectory-consumer --output-on-failure
          cmake -S examples/fetch-content -B build/fetch-content-consumer -G Ninja -DCMAKE_BUILD_TYPE=Release -DFETCHCONTENT_SOURCE_DIR_LATCH=${{ github.workspace }}
          cmake --build build/fetch-content-consumer --parallel
          ctest --test-dir build/fetch-content-consumer --output-on-failure
          cpack -B build/packages --config build/host-debug/CPackConfig.cmake -C Debug
          python tools/test_cpack_archive.py build/packages/laststate-latch-0.2.0-Linux.zip --consumer tests/package --config Debug
      - name: Validate documentation, vectors, and source distribution
        run: |
          python tools/check_docs.py
          python tools/check_test_vector.py
          python tools/test_minify_sources.py
          python tools/seed_fuzz_corpora.py --output build/fuzz-seeds
          python tools/minify_sources.py --output build/compact-source --verify
          cmake -S build/compact-source -B build/compact-check -G Ninja -DCMAKE_BUILD_TYPE=Release -DLS_BUILD_TESTS=ON
          cmake --build build/compact-check --parallel
          ctest --test-dir build/compact-check --output-on-failure --timeout 120
      - name: Validate GitHub Actions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint -color
      - name: Validate Rust SDK
        run: |
          cargo fmt --manifest-path rust/latch/Cargo.toml -- --check
          cargo clippy --manifest-path rust/latch/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path rust/latch/Cargo.toml
          cargo package --manifest-path rust/latch/Cargo.toml --allow-dirty
          cargo check --manifest-path rust/latch/Cargo.toml --target thumbv7em-none-eabihf
          cargo check --manifest-path rust/latch/Cargo.toml --target riscv32imac-unknown-none-elf
