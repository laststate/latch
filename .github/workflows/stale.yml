name: Stale repository bot
on:
  schedule:
    - cron: '13 7 * * 0'
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure stale label exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh label create stale --repo "$REPO" --color eeeeee --force
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          repo-token: ${{ github.token }}
          stale-issue-message: This issue has had no activity for 60 days. Comment or remove the stale label to keep it open.
          stale-pr-message: This pull request has had no activity for 45 days. Update it to remove the stale label.
          days-before-issue-stale: 60
          days-before-issue-close: -1
          days-before-pr-stale: 45
          days-before-pr-close: -1
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: security,automation-failure,good first issue,help wanted,hardware
          exempt-pr-labels: security,dependencies
          exempt-draft-pr: true
